<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game — The Kitsune's Tea House</title>
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <!-- The words, then the language picker, then the game. defer keeps this order. -->
  <script src="js/text.js" defer></script>
  <script src="js/i18n.js" defer></script>
  <script src="js/game.js" defer></script>
</head>
<body data-page="game">
  <a class="skip-link" href="#main" data-t="pages.skip">Skip to content</a>

  <header class="site-header">
    <p class="site-title" data-t="pages.siteTitle">The Kitsune's Tea House</p>

    <nav data-t-label="pages.navMain" aria-label="Main">
      <ul class="nav">
        <li><a href="index.html" data-t="pages.navHome">Home</a></li>
        <li><a href="game.html" aria-current="page" data-t="pages.navGame">Game</a></li>
        <li><a href="how-to.html" data-t="pages.navHowTo">How to Play</a></li>
      </ul>
    </nav>

    <nav data-t-label="pages.navLanguage" aria-label="Language">
      <ul class="nav nav--lang">
        <li><a href="?lang=en" data-lang="en" lang="en" hreflang="en" aria-label="English">EN</a></li>
        <li><a href="?lang=pt" data-lang="pt" lang="pt" hreflang="pt" aria-label="Português">PT</a></li>
        <li><a href="?lang=es" data-lang="es" lang="es" hreflang="es" aria-label="Español">ES</a></li>
        <li><a href="?lang=fr" data-lang="fr" lang="fr" hreflang="fr" aria-label="Français">FR</a></li>
        <li><a href="?lang=ja" data-lang="ja" lang="ja" hreflang="ja" aria-label="日本語">JP</a></li>
      </ul>
    </nav>
  </header>

  <main id="main" class="game">
    <section class="stage" aria-labelledby="scene-title">
      <!-- The scene: the portrait, with the candle and the dialogue over it -->
      <div class="stage__scene">
        <!-- game.js swaps the portrait and its alt text; until the art exists
             it keeps the placeholder caption instead -->
        <figure class="host" id="host">
          <img id="host-image" alt="" hidden>
          <figcaption id="host-caption" data-t="pages.gameHostImage">Host illustration</figcaption>
        </figure>

        <!-- Filled in by game.js; aria-live reads changes aloud -->
        <div class="hud" aria-live="polite">
          <p class="status__label" id="candle-label">Candle: 6 of 6 marks left</p>
          <div class="candle" id="candle" aria-hidden="true"></div>
          <p class="suspicion" id="suspicion">She is pouring tea.</p>
        </div>

        <div class="dialogue">
          <!-- tabindex="-1" lets game.js move focus here after each choice -->
          <h1 class="scene-title" id="scene-title" tabindex="-1">Mark 6 — Arrival</h1>
          <div class="scene-text" id="scene-text">
            <noscript><p>This game needs JavaScript to play.</p></noscript>
          </div>
        </div>
      </div>

      <!-- Built by game.js from the current mark -->
      <div class="choices" id="choices" role="group" data-t-label="pages.gameChoices" aria-label="Choices"></div>
    </section>

    <aside class="clues" aria-labelledby="clues-title">
      <div class="clues__head">
        <h2 id="clues-title" data-t="pages.gameClues">Confirmed clues</h2>
        <button class="btn btn--quiet btn--small" type="button" id="log-button" data-t="pages.gameLog">Log</button>
      </div>
      <ul id="clues"></ul>
    </aside>

    <!-- <dialog> gives Esc to close and keeps focus inside, with no library -->
    <dialog class="log" id="log-dialog" aria-labelledby="log-title">
      <h2 id="log-title" data-t="pages.gameLogTitle">What has happened</h2>
      <div class="log__entries" id="log-entries"></div>
      <button class="btn" type="button" id="log-close" data-t="pages.gameLogClose">Close</button>
    </dialog>
  </main>

  <footer class="site-footer">
    <p data-t="pages.footer">A short story game in plain HTML, CSS and JavaScript.</p>
  </footer>
</body>
</html>
